<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account · Wina Bwangu agent console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="container">
    <!-- Wina Bwangu Branding -->
    <div class="wina-bwangu">
      <h1>Wina Bwangu</h1>
      <h2>Mobile Money Management System</h2>
    </div>

    <form id="RegisterForm" class="auth-form" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" autocomplete="off" placeholder="Enter your username">
        <small class="error-msg" id="usernameError"></small>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <small class="error-msg" id="passwordError"></small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" name="confirmPassword">
        <small class="error-msg" id="confirmPasswordError"></small>
      </div>

      <button type="submit">Create account</button>
    </form>

    <p class="login-link">
        Already have an account? <a href="login.html">Log in</a>
    </p>

    <div id="message"></div>
  </div>

  <script src="register.js"></script>
</body>
</html>
